name: QSMPFrontier
version: '1.4.0'
main: dev.qsmp.frontier.QSMPFrontier
api-version: '26.1'
description: Cinematic open-field raids, ruin expeditions, survivor levels, legacy gear, dragon raids, tactical companions, dynamic combat, and resource outposts.
authors: [QSMP]
softdepend: [QSMPCompanions, LevelledMobs]
commands:
  frontier:
    description: Manage Frontier combat, roles, survivor progression, legacy gear, outposts, ruin expeditions, and warfront raids.
    aliases: [ark]
    usage: /frontier <role|give|warfront|expedition|survivor|legacy|status|reload>
  survivor:
    description: Open the Survivor Core stat GUI.
    usage: /survivor [stats|spend|respec]
  legacy:
    description: Open the Legacy Arsenal gear GUI.
    usage: /legacy [refine|awaken|transfer]
permissions:
  qsmpfrontier.admin:
    description: Build and control warfronts and give outpost cores.
    default: op
